<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuneFable Tower Defense — Defend the Forgeheart</title>
<meta name="description" content="RuneFable Tower Defense: hold Veyra's roads against the Pale Court. A RuneFable franchise game by The Justin HQ. Prototype in development.">
<link rel="icon" type="image/png" href="assets/shield.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #141d27 radial-gradient(ellipse at 50% 30%, #22344a 0%, #141d27 60%);
    color: #f0ead8;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem 1rem;
  }
  .shield { width: 180px; height: 180px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .wordmark { width: min(560px, 88vw); margin-top: 1.6rem; border-radius: 12px; }
  .tagline { margin-top: 1.1rem; font-size: 1.25rem; font-style: italic; color: #e8c97a; letter-spacing: .02em; }
  .status {
    margin-top: 2rem; padding: .7rem 1.4rem; border: 1px solid #4a5f7a; border-radius: 999px;
    background: rgba(24, 36, 50, .8); font-family: Verdana, sans-serif; font-size: .85rem; letter-spacing: .14em;
    text-transform: uppercase; color: #b9c9dc;
  }
  .about { margin-top: 2rem; max-width: 560px; line-height: 1.65; color: #cfd8e3; font-size: 1.02rem; }
  footer { margin-top: 3rem; font-family: Verdana, sans-serif; font-size: .78rem; color: #7e93ab; letter-spacing: .08em; }
</style>
</head>
<body>
  <img class="shield" src="assets/shield.png" alt="RFTD shield logo">
  <img class="wordmark" src="assets/wordmark.png" alt="RuneFable Tower Defense">
  <p class="tagline">Defend the Forgeheart.</p>
  <p class="status">Prototype in development</p>
  <p class="about">The Pale Court is marching on the Forgeheart. Raise the towers of Veyra's four races
  along its roads and hold every town, pass, and shore. A tower defense game set in the world of RuneFable.</p>
  <footer>A THE JUSTIN HQ GAME</footer>
</body>
</html>
