<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RuneFable Tower Defense</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="rftd-fill">
    <!-- RuneFable Tower Defense, ARENA CONT3 (gap 7): the game fills the browser's viewport on every device. Unity's
         Default template fixed the desktop canvas at 960 x 600 CSS pixels in a centred box (a live pass saw white
         margins round it in a 1919 x 998 window) and filled the window only on a mobile user agent. Here the canvas is
         the viewport, the engine keeps its render target matched to it (matchWebGLToCanvasSize), and a phone's device
         pixel ratio is capped for the frame rate. The element ids are the Default template's, so the frame drives
         (tools/arena/*.js) and the loader's banner keep working. -->
    <div id="unity-container" class="rftd-fill">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">RuneFable Tower Defense</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or a permanent error message on top of the canvas
      // if type=='error'. If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "The Justin HQ",
        productName: "RuneFable Tower Defense",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // rftd-fill: the engine sizes its render target to the canvas's CSS size times the pixel ratio every frame, so the
      // canvas is simply the viewport (style.css) and any resize, fullscreen or rotation follows. A phone's ratio is
      // capped: three times the pixels of a 1080p frame is more than the vale wants at 60 frames per second.
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (mobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.rftdUnityInstance = unityInstance;
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
